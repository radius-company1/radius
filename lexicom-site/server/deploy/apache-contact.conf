# Insert INSIDE the existing HTTPS VirtualHost for lexicom.ai.
# Requires proxy, proxy_http, headers. Place BEFORE catch-all ProxyPass /.
# Preserve the existing DocumentRoot, TLS settings and old-site routes.
ProxyPass "/api/contact" "http://127.0.0.1:8787/api/contact" connectiontimeout=5 timeout=30
ProxyPassReverse "/api/contact" "http://127.0.0.1:8787/api/contact"
<Location "/api/contact">
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    LimitRequestBody 16384
</Location>
